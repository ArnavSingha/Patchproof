[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.1.0"
description = "Deterministic code-patch verification and reliability engine for AI-assisted engineering"
readme = "README.md"
authors = [{ name = "PatchProof Team" }]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "testing",
    "verification",
    "sandbox",
    "docker",
    "ai-agents",
    "anti-cheat",
    "diff",
    "patch",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/ArnavSingha/Patchproof"
Repository = "https://github.com/ArnavSingha/Patchproof"
Documentation = "https://github.com/ArnavSingha/Patchproof#readme"
"Bug Tracker" = "https://github.com/ArnavSingha/Patchproof/issues"

[project.scripts]
patchproof = "patchproof.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.Dockerfile", "docker/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
