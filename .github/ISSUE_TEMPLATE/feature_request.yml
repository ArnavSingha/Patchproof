name: Feature Request
description: Suggest an idea or enhancement for PatchProof
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make PatchProof even better? We'd love to hear it.
  - type: textarea
    id: proposal
    attributes:
      label: Problem & Proposal
      description: What problem are you trying to solve, and what is your proposed solution?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or workarounds you've considered?
    validations:
      required: false
