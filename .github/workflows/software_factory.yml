name: AI Software Factory

on:
  schedule:
    # Nightly run at 02:00 UTC (automated signal for drift & dependency health)
    - cron: '0 2 * * *'
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      trigger_signal:
        description: "Trigger signal identifier or description"
        required: false
        default: "manual_dispatch"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  software-factory:
    name: Autonomous Factory Lineage Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PatchProof and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assess Blast Radius Gate
        id: blast_radius
        run: |
          echo "Evaluating blast radius for incoming signal..."
          # If triggered via issue or cron, evaluate uncommitted changes or HEAD
          if git diff --quiet HEAD~1 HEAD 2>/dev/null; then
            echo "lineage=lineage_a" >> $GITHUB_OUTPUT
            echo "risk=low" >> $GITHUB_OUTPUT
          else
            patchproof factory evaluate --head --json > blast_radius.json
            cat blast_radius.json
            LINEAGE=$(python -c "import json; print(json.load(open('blast_radius.json'))['lineage'])")
            echo "lineage=$LINEAGE" >> $GITHUB_OUTPUT
          fi

      - name: Execute Lineage A (Level 4: Contained / Autonomous Ship)
        if: steps.blast_radius.outputs.lineage == 'lineage_a'
        run: |
          echo "======================================================="
          echo "Executing Lineage A: Contained change ships autonomously"
          echo "======================================================="
          ruff check .
          mypy --strict src/ tests/
          pytest -q
          echo "Lineage A validation passed. Patch verified for autonomous production release."

      - name: Execute Lineage B (Level 3: Breaking / Ephemeral Sandbox)
        if: steps.blast_radius.outputs.lineage == 'lineage_b'
        run: |
          echo "======================================================="
          echo "Executing Lineage B: Ephemeral Sandbox with Operator Gate"
          echo "======================================================="
          # Execute deterministic gate inside isolated runner
          ruff check .
          mypy --strict src/ tests/
          pytest -q
          echo "Lineage B verification passed in ephemeral sandbox. Ready for operator sign-off."

      - name: Operator Gate Sign-off (Lineage B)
        if: steps.blast_radius.outputs.lineage == 'lineage_b' && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### [PatchProof AI Software Factory] Lineage B Operator Gate\n\n' +
                    'Deterministic verification passed in ephemeral sandbox.\n' +
                    '- **Risk Level**: HIGH (Breaking)\n' +
                    '- **Lineage**: Lineage B (Level 3)\n' +
                    '- **Status**: Awaiting 1-Click Operator Approval to deploy to production.'
            });
